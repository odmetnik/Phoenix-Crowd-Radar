name: Android development APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash tests/run.sh
      - run: python3 tests/check_help.py
      - run: node tests/ui.mjs
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Crowd-Radar-0.6.0-dev-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enrollment smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          profile: pixel_6
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash tools/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phoenix-Crowd-Radar-0.6.0-dev-UI
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dashboard.png
            ar-hud.png
            focus-failure.png
            app/build/reports/androidTests/connected/
          if-no-files-found: error
