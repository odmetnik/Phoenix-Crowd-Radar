name: Android development APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash tests/run.sh
      - run: python3 tests/check_help.py
      - run: node tests/ui.mjs
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enrollment smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            test_status=0
            gradle --no-daemon :app:connectedDebugAndroidTest || test_status=$?
            adb pull /sdcard/Android/data/hr.phoenixart.crowdradar/files/dashboard.png dashboard.png || true
            exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phoenix-Crowd-Radar-0.4.0-dev
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dashboard.png
            app/build/reports/androidTests/connected/
          if-no-files-found: error
